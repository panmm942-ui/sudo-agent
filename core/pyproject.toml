[project]
name = "sudo-core"
version = "0.1.0"
description = "sudo local voice assistant core"
requires-python = "==3.12.*"
dependencies = [
    "gliner2[local]",
    "onnx-asr",
    "onnxruntime-gpu[cuda,cudnn]",
    "huggingface_hub",
    "httpx",
    "jiwer",
    "sounddevice",
    "soundfile",
    "numpy",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sudo_core"]

[tool.pytest.ini_options]
addopts = "-m 'not model'"
markers = ["model: requires downloaded models / GPU (excluded by default)"]
testpaths = ["tests"]
