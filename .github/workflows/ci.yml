name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend · type check, unit tests, build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Type check (svelte-check)
        run: npm run check
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Production build
        run: npm run build
      - name: Extension runtime tests (Playwright)
        run: |
          npx playwright install chromium
          npx playwright test --config playwright.extensions.config.ts

  rust:
    name: Desktop app · clippy, Rust tests, Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      # tauri::generate_context! embeds ../build, so the frontend is built before any cargo step.
      - run: npm run build
      - name: Lint (clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --features tauri/custom-protocol --all-targets
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features tauri/custom-protocol --lib
      - name: Build Windows installer (NSIS)
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: sudo-windows-x64-${{ github.sha }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/sudo-island.exe
          retention-days: 14
          if-no-files-found: error

  core:
    name: Python core · tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      # Tests marked `model` need downloaded models and a GPU; pyproject excludes them by default.
      - run: uv sync --locked
      - run: uv run --locked pytest -q

  companion:
    name: Online companion · type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - run: npm ci
      - run: npm run check
